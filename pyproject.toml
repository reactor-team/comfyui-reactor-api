[project]
name = "comfyui-reactor-api"
version = "0.2.0"
description = "ComfyUI nodes that render timelines on Reactor real-time video models."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["reactor-sdk>=1.6"]

[project.urls]
Repository = "https://github.com/reactor-team/comfyui-reactor-api"

[tool.comfy]
PublisherId = "reactor"
DisplayName = "Reactor API: Realtime Video"
Icon = "https://avatars.githubusercontent.com/u/216609888?s=400&v=4"

[dependency-groups]
dev = [
    "av",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false
exclude-newer = "7 days"
exclude-newer-package = { reactor-sdk = false }

